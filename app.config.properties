# ════════════════════════════════════════════════════════════════════════════
#  app.config.properties — Parametri applicazione (versionato)
#
#  Modifica liberamente questi valori; riavvia il server per applicarli.
#  Formato: CHIAVE=valore   |   righe con # ignorate
# ════════════════════════════════════════════════════════════════════════════

# ── Rilevamento stato nave ───────────────────────────────────────────────────

# Soglia SOG (nodi) sotto cui la nave è considerata ferma
SOG_FERMA_KN=0.5

# Raggio (metri): ultime posizioni entro questo raggio → nave ormeggiata (isteresi anti-swing)
STILL_RADIUS_M=100

# ── Finestre di visibilità ───────────────────────────────────────────────────

# Ore: una nave in movimento viene mostrata in "Navi presenti" se vista in questa finestra
ACTIVE_WINDOW_HOURS=6

# Ore: una nave in porto (ormeggiata/all'ancora/ferma) resta in "Navi presenti" più a lungo
PORT_WINDOW_HOURS=24

# ── Connessione e polling ────────────────────────────────────────────────────

# Millisecondi: attesa prima di riconnettersi ad AISStream dopo un errore
RECONNECT_DELAY_MS=5000

# Millisecondi: intervallo di aggiornamento del frontend (default 5 minuti)
POLL_INTERVAL_MS=300000

# Rilevamento disservizio AIS: se uno stream attivo non riceve messaggi per
# AIS_OUTAGE_SILENCE_MIN minuti, l'app interroga un monitor di uptime AISStream
# (progetto MIT github.com/buttermilkgreen/AISStream-Uptime) tramite la sua API
# /api/v1/status. Solo se anche quel monitor riporta il servizio non attivo
# viene mostrato un banner di disservizio nelle pagine di monitoraggio. Imposta
# AIS_OUTAGE_CHECK=false per disabilitare del tutto.
#
# Modalità ibrida: i monitor vengono interrogati in ordine di priorità e il
# primo che risponde decide. AIS_UPTIME_SELFHOST_URL è una TUA istanza
# self-hosted del monitor (interrogata per prima: con un deploy sano non si
# contatta mai il servizio pubblico); lasciala vuota se non ne hai una.
# AIS_UPTIME_URL è il monitor pubblico, usato come ripiego e indicatore di un
# disservizio globale (riscontrato dalla community).
AIS_OUTAGE_CHECK=true
AIS_OUTAGE_SILENCE_MIN=10
AIS_UPTIME_SELFHOST_URL=
AIS_UPTIME_URL=https://aisuptime.buttermilkgreen.fyi

# ── Traccia mappa ────────────────────────────────────────────────────────────

# Raggio (metri): punti fermi consecutivi entro questo raggio vengono collassati in una "Sosta"
TRACK_MERGE_RADIUS_M=100

# Numero default di punti traccia restituiti dall'API
TRACK_DEFAULT_LIMIT=500

# Numero massimo di punti traccia (cap sulla richiesta del client)
TRACK_MAX_LIMIT=2000

# ── Retention database ───────────────────────────────────────────────────────

# Numero massimo di letture mantenute per tipo messaggio AIS (rotazione automatica)
MAX_READINGS_PER_TYPE=10000

# Numero massimo di righe nel log API (tabella api_log nel DB, non un file);
# le righe piu' vecchie vengono eliminate a ogni inserimento (rotazione automatica)
MAX_API_LOG_RECORDS=1000

# Ore: TTL cache scraping VesselFinder/MarineTraffic
SCRAPE_CACHE_TTL_HOURS=6

# Giorni: per quanto tempo una nave per cui VF/MT non ha restituito dati (lookup
# fallito o 404) viene saltata dal backfill, per non ri-contattare ad ogni
# riattivazione le navi che le fonti non conoscono. 0 = disabilitato (ritenta sempre).
SCRAPE_NEG_CACHE_DAYS=3

# Lunghezza massima (byte) del body request/response salvato nel log API.
# Il body medio è ~600B: 2048 conserva quasi ogni payload reale e limita le rare
# risposte grandi che gonfierebbero la tabella api_log.
MAX_BODY_BYTES=2048

# Dimensione massima (MB) di un file caricato per ripristino/bundle. Limita il
# buffer in memoria: una singola richiesta non può esaurire la RAM. Generoso di
# default per contenere un database codificato base64 (~1.3× la dimensione .db).
MAX_UPLOAD_MB=512

# ── Notifiche ────────────────────────────────────────────────────────────────

# Secondi della finestra di annullamento (bounce) prima che l'eliminazione delle
# notifiche diventi effettiva — vale sia per la singola notifica sia per
# "cancella tutte". Impostare 0 per eliminazione immediata senza annullamento.
NOTIF_DELETE_UNDO_SECONDS=5

# ── Backup automatico ────────────────────────────────────────────────────────
# Minuti tra un auto-backup su disco e il successivo (cartella data/backups/,
# ultimi 5 conservati). Un primo backup parte comunque ~30s dopo l'avvio.
BACKUP_INTERVAL_MIN=120

# ── Deploy / ripristino automatico ───────────────────────────────────────────
# Se all'avvio il file del database (ais_data.db) è ASSENTE — es. cancellato da
# un deploy — e in data/backups/ esiste almeno un auto-backup, ripristina
# automaticamente l'ultimo (solo il database; aree e impostazioni sono file che
# sopravvivono al deploy). Non scatta se il DB esiste ma è vuoto (così
# "Cancella dati" + riavvio non resuscita i dati). true (default) | false
AUTO_RESTORE_ON_DEPLOY=true

# ── Heatmap copertura globale AISStream (solo admin) ─────────────────────────
# Pagina /admin/heatmap: una sottoscrizione AISStream sul mondo intero aggrega i
# messaggi di posizione in una griglia lat/lon (conteggio per cella) per vedere
# dove la copertura è densa e dove ci sono buchi. Richiede HEATMAP_AIS_API_KEY in
# local.properties, di un ACCOUNT AISStream SEPARATO (il limite di connessioni è
# per-account). Costo: ~100–300 msg/s, ~200–400 MB/ora, solo mentre la pagina è
# aperta.
#
# Dimensione cella in gradi. Più piccolo = più preciso ma il costo cresce in modo
# quadratico (dimezzando il lato → 4× le celle: payload, render mappa e righe DB).
# 0.5°≈55km · 0.25°≈28km · 0.1°≈11km (a 0.1° servirebbe il caricamento per
# viewport, non ancora implementato). ATTENZIONE: cambiare questo valore rende
# incompatibili le celle già salvate (l'indice è floor(coord/grid)) → azzera i
# dati della heatmap dopo il cambio (pulsante "Cancella dati heatmap").
HEATMAP_GRID_DEG=0.25

# Secondi tra un flush su DB e l'altro dei conteggi accumulati in memoria.
HEATMAP_FLUSH_SEC=10

# Secondi tra un aggiornamento e l'altro delle statistiche live (banda, msg/s)
# inviate alla pagina via SSE.
HEATMAP_STATS_SEC=2

# ── Banchine (caratterizzazione attracchi) ───────────────────────────────────
# Il sistema raggruppa automaticamente i punti di attracco delle navi in
# "banchine" e analizza quali tipologie di nave vi attraccano. I cluster e le
# caratterizzazioni sono modificabili a mano dall'interfaccia.

# Raggio di clustering (metri): due attracchi entro questa distanza appartengono
# alla stessa banchina (epsilon del DBSCAN). Banchine portuali ~50–150 m.
BERTH_CLUSTER_EPS_M=80

# Numero minimo di attracchi vicini perché si formi una banchina (minPts DBSCAN)
BERTH_MIN_PTS=3

# Numero minimo di attracchi prima che una banchina venga caratterizzata/colorata
BERTH_MIN_MOORINGS=10

# Percentuale (0–100) che una categoria deve superare per dare il nome alla
# banchina; sotto questa soglia la banchina è etichettata "mista".
BERTH_DOMINANT_PCT=60

# Minuti: intervallo del ricalcolo periodico (sweep completo) di attracchi e banchine
BERTH_RECOMPUTE_MIN=30

# Minuti: intervallo del ricalcolo rapido delle SOLE aree che hanno ricevuto nuovi
# arrivi dall'ultimo flush, così la lista banchine resta aggiornata senza sweep completo
BERTH_DIRTY_FLUSH_MIN=2


# ════════════════════════════════════════════════════════════════════════════
#  Rilevamento rendezvous nave-nave (ship-to-ship / possibile trasbordo)
#
#  Scansione periodica per area che segnala coppie di navi distinte che sostano
#  vicine, lente e al largo. Una coppia "apre" un contatto entro DIST_M, resta
#  aperto entro DIST_M × CLOSE_MULT (isteresi), e fa scattare UNA notifica + un
#  fattore di rischio su ENTRAMBE le navi quando la permanenza supera MIN_MINUTES.
# ════════════════════════════════════════════════════════════════════════════

# Minuti tra una scansione e l'altra. 0 = disattiva del tutto il rilevamento.
PROXIMITY_SCAN_MIN=10

# Metri: distanza entro cui una coppia di navi apre un contatto.
PROXIMITY_DIST_M=500

# Moltiplicatore di isteresi: il contatto resta aperto finché la coppia è entro
# DIST_M × CLOSE_MULT, così un singolo fix rumoroso non lo chiude di colpo.
PROXIMITY_CLOSE_MULT=1.5

# Minuti di permanenza ravvicinata prima che scatti la notifica (anti-incrocio).
PROXIMITY_MIN_MINUTES=10

# Nodi: entrambe le navi devono essere sotto questa velocità (transito = scartato).
PROXIMITY_MAX_SOG_KN=3

# Metri da un berth noto: una nave entro questa distanza da un centroide di berth
# è considerata in porto e scartata (esclude i rendezvous in banchina).
PROXIMITY_BERTH_M=600

# Km dal centro dell'area: ripiego solo per le aree senza berth ancora calcolati;
# in tal caso entrambe devono essere più al largo di così (in porto no).
PROXIMITY_FAR_KM=10

# Minuti: ignora le navi il cui ultimo fix è più vecchio di così (niente fantasmi).
PROXIMITY_FRESH_MIN=20


# ════════════════════════════════════════════════════════════════════════════
#  Replay storico (time-scrubber sulla mappa dell'area)
#
#  Riproduce le posizioni di tutte le navi in un'area su una finestra temporale.
#  Clock globale T_start→T_end; ogni nave interpolata tra i suoi fix a T.
# ════════════════════════════════════════════════════════════════════════════

# Numero massimo di posizioni restituite da una singola query di replay; oltre
# questo limite il server tronca (downsample) e segnala la risposta come troncata.
REPLAY_MAX_POINTS=40000

# Minuti: una nave è nascosta nei momenti del clock che cadono dentro un buco tra
# due fix più lungo di così (niente moto inventato dove non ci sono dati).
REPLAY_MAX_GAP_MIN=30

# Minuti: lunghezza della scia che sfuma dietro ogni nave durante il replay.
REPLAY_TAIL_MIN=20


# ════════════════════════════════════════════════════════════════════════════
#  Pesi score di rischio (potenziale trasporto armi)
#
#  Formula: score = clamp( round( subtotaleAnomalie × moltiplicatore ), 0, 100 )
#  Fasce:  0–30 verde (basso) · 31–70 giallo (medio) · 71–100 rosso (alto)
#  Navi militari (tipo AIS 35): score 100 fisso, nessuna analisi comportamentale.
# ════════════════════════════════════════════════════════════════════════════

# ── Dark activity (blackout AIS mentre la nave è in navigazione) ─────────────
# Punteggio massimo assegnato per dark activity (spegnimento AIS in navigazione)
RISK_DARK_MAX=25
# Ore di blackout AIS sotto cui non si assegna alcun punteggio
RISK_DARK_MIN_H=2
# Ore di blackout AIS oltre cui si assegna il punteggio pieno (RISK_DARK_MAX)
RISK_DARK_MAX_H=6
# Punteggio minimo quando il blackout è nella fascia intermedia (poi interpolato fino a RISK_DARK_MAX)
RISK_DARK_PARTIAL_MIN=8

# ── Spoofing / salto di posizione impossibile ────────────────────────────────
# Velocità implicita calcolata tra due posizioni consecutive (Δt ≤ 1h, distanza > 500 m)
# Punteggio massimo assegnato per spoofing / salti di posizione impossibili
RISK_SPOOFING_MAX=20
# Punti per ogni salto a velocità anomala (tra ANOMALOUS_KN e IMPOSSIBLE_KN)
RISK_SPOOF_ANOMALOUS_POINTS=12
# Velocità implicita (nodi) oltre cui il salto è fisicamente impossibile → spoofing certo
RISK_SPOOF_IMPOSSIBLE_KN=80
# Velocità implicita (nodi) oltre cui il salto è anomalo (sospetto)
RISK_SPOOF_ANOMALOUS_KN=50

# ── Loitering (sosta anomala in mare aperto, non ormeggiata) ─────────────────
# Punteggio massimo per loitering (sosta ferma in mare aperto, lontano dalla costa)
RISK_LOITERING_MAX=15
# Punteggio parziale per loitering moderato (poche posizioni o vicino alla soglia)
RISK_LOITERING_PARTIAL=7
# Numero minimo di posizioni ferme lontane dalla costa per considerare loitering
RISK_LOITERING_MIN_POSITIONS=3
# Distanza (km) dal centro dell'area oltre cui una sosta è considerata "in mare aperto"
RISK_LOITERING_FAR_KM=10

# ── Aumento pescaggio (carico imbarcato) ─────────────────────────────────────
# Punteggio massimo per aumento del pescaggio = clamp(delta_m × RISK_DRAUGHT_FACTOR, 0, qui)
RISK_DRAUGHT_MAX=20
# Punti per ogni metro di aumento del pescaggio rispetto al minimo storico
RISK_DRAUGHT_FACTOR=12
# Aumento minimo del pescaggio (metri) sotto cui non si assegna punteggio
RISK_DRAUGHT_MIN_DELTA_M=0.5

# ── Instabilità destinazione ─────────────────────────────────────────────────
# Punteggio massimo per instabilità della destinazione dichiarata
RISK_DEST_MAX=10
# Punti per ogni destinazione diversa dichiarata oltre la prima
RISK_DEST_PER_CHANGE=4

# ── Tipo di carico (peso del rischio per classe merceologica) ────────────────
# Il punteggio di tipo nave NON usa più questi due valori fissi: il rischio è ora
# assegnato per CLASSE DI CARICO (portacontainer, petroliera greggio, chimichiera,
# gasiera, rinfusiera, ecc.), derivata dal sottotipo VesselFinder/MarineTraffic con
# ripiego sul codice AIS. I pesi per classe sono modificabili a runtime dalla UI
# (Impostazioni → "Pesi rischio per tipo di carico") e vengono salvati come singola
# riga JSON RISK_CARGO_WEIGHTS in local.properties — non qui. Con "Escludi tanker"
# attivo, le classi su scafo tanker non assegnano punti.
# I due valori sotto restano solo per retro-compatibilità e NON sono più letti dal
# calcolo del punteggio.
RISK_HAZMAT_POINTS=8
RISK_CARGO_POINTS=5

# ── Cambio nome scafo (name/flag hopping) ────────────────────────────────────
# Punti quando lo stesso MMSI ha trasmesso nomi nave diversi nel tempo (name hopping)
RISK_NAME_HOPPING_POINTS=8

# ── Arricchimento VesselFinder / MarineTraffic ───────────────────────────────
# Punti se la bandiera della nave appartiene a un Paese sotto embargo
RISK_EMBARGO_FLAG_POINTS=12
# Punti se la nave batte una bandiera di comodo (Flag of Convenience)
RISK_FOC_FLAG_POINTS=5
# Punti per navi molto vecchie (età ≥ RISK_OLD_VESSEL_MIN_AGE anni)
RISK_OLD_VESSEL_POINTS=6
# Punti se il porto di immatricolazione (home port) è in un Paese ad alto rischio
RISK_HIGH_RISK_HOMEPORT_POINTS=8
# Punti per match in lista sanzioni OFAC SDN (IMO/nome/call sign): segnale fortissimo
RISK_SANCTION_MATCH_POINTS=60
# Età minima (anni) oltre cui una nave è considerata "vecchia" per RISK_OLD_VESSEL_POINTS
RISK_OLD_VESSEL_MIN_AGE=35

# ── Port State Control (Paris / Tokyo MoU) ───────────────────────────────────
# Punti se la bandiera è in black list MoU (registro ad alto rischio per fermi/ispezioni)
RISK_PSC_BLACK_FLAG_POINTS=12
# Punti se la bandiera è in grey list MoU (performance intermedia)
RISK_PSC_GREY_FLAG_POINTS=5
# Punti se la nave è nella banned list Paris MoU (refusal of access dopo fermi multipli)
RISK_PSC_BANNED_POINTS=40

# ── Global Fishing Watch (eventi comportamentali AIS-derived) ────────────────
# Punti se GFW ha rilevato uno o più incontri in mare (encounter): firma classica
# di trasbordo nave-a-nave. È il segnale GFW più forte.
RISK_GFW_ENCOUNTER=18
# Punti se GFW ha rilevato uno o più eventi di AIS spento ("gap"/dark activity)
RISK_GFW_GAP=15
# Punti se GFW ha rilevato uno o più eventi di loitering (sosta in mare aperto)
RISK_GFW_LOITERING=12
# Punti se GFW registra uno scalo in un porto/area ad alto rischio (embargo/conflitto)
RISK_GFW_PORT_VISIT_HIGH_RISK=15

# ── Rendezvous nave-nave (rilevamento locale, vedi sezione PROXIMITY sopra) ──
# Punti aggiunti a ENTRAMBE le navi per un rendezvous confermato nella finestra
# recente — firma di trasbordo, calcolata sul nostro feed AIS. 0 = disattiva il
# fattore (la scansione continua comunque a popolare lo storico).
RISK_PROXIMITY_POINTS=18
# Giorni: finestra entro cui un rendezvous passato contribuisce ancora al punteggio.
RISK_PROXIMITY_WINDOW_DAYS=7

# ── Moltiplicatori geopolitici (applicati al subtotale anomalie) ─────────────
# Incremento del moltiplicatore finale se destinazione/bandiera è sotto embargo o in zona di conflitto (es. 0.5 = +50%)
RISK_MULT_HIGH_RISK=0.5
# Incremento del moltiplicatore finale se la nave batte bandiera di comodo (es. 0.2 = +20%)
RISK_MULT_FOC=0.2
