<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — Tracker Porti</title>
<style>
  :root { --bg:#0a0d13; --surface:#141a24; --surface-2:#1c2430; --border:#2a3441;
          --text:#e6edf5; --text-muted:#9aa7b5; --accent:#3b82f6; --accent-hover:#2563eb;
          --red:#ef4444; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:1rem; }
  .card { position:relative; width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
          border-radius:14px; padding:2rem 1.75rem; box-shadow:0 12px 40px rgba(0,0,0,.4); }
  h1 { font-size:1.2rem; margin:0 0 .25rem; }
  .sub { color:var(--text-muted); font-size:.85rem; margin:0 0 1.25rem; }
  label { display:block; font-size:.8rem; color:var(--text-muted); margin:.9rem 0 .3rem; }
  input { width:100%; padding:.6rem .7rem; background:var(--surface-2); border:1px solid var(--border);
          border-radius:8px; color:var(--text); font-size:.95rem; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:1.4rem; padding:.7rem; background:var(--accent); color:#fff; border:0;
           border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent-hover); }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:1rem; font-size:.85rem; min-height:1.2em; }
  .msg.err { color:var(--red); }
  .msg.ok { color:var(--green); }
  .links { margin-top:1.3rem; font-size:.82rem; text-align:center; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .lang-switch { position:absolute; top:.9rem; right:1rem; display:flex; gap:.4rem; font-size:.78rem; }
  .lang-switch button { all:unset; width:auto; margin:0; padding:.15rem .4rem; border-radius:5px;
                         cursor:pointer; color:var(--text-muted); }
  .lang-switch button:hover { color:var(--text); background:var(--surface-2); }
  .lang-switch button.active { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <h1 id="title">Reset password</h1>
    <p class="sub" id="sub"></p>
    <div id="fields"></div>
    <button type="submit" id="submit">Continua</button>
    <div class="msg" id="msg"></div>
    <div class="links"><a href="/login" id="backLink">Torna all'accesso</a></div>
  </form>
<script>
  // Same 'lang' localStorage key as the app (public/js/i18n.js) and as login.html —
  // a choice made there (or here) carries over across the auth pages.
  const STRINGS = {
    it: {
      pageTitle: 'Reset password — Tracker Porti',
      title: 'Reset password',
      subToken: 'Scegli una nuova password.',
      subRequest: 'Inserisci la tua email o username: senza email configurata il reset va richiesto a un amministratore.',
      labelPw: 'Nuova password', labelIdentifier: 'Email o username',
      submit: 'Continua', backLink: 'Torna all\'accesso',
      doneToken: 'Password aggiornata. Ora puoi accedere.', doneRequest: 'Richiesta registrata.',
      failErr: 'Operazione non riuscita', netErr: 'Errore di rete',
    },
    en: {
      pageTitle: 'Reset password — Tracker Porti',
      title: 'Reset password',
      subToken: 'Choose a new password.',
      subRequest: 'Enter your email or username: without a configured email, the reset must be requested from an administrator.',
      labelPw: 'New password', labelIdentifier: 'Email or username',
      submit: 'Continue', backLink: 'Back to sign in',
      doneToken: 'Password updated. You can now sign in.', doneRequest: 'Request submitted.',
      failErr: 'Operation failed', netErr: 'Network error',
    },
  };

  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const sub = document.getElementById('sub');
  const fields = document.getElementById('fields');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');

  function applyLang(lang) {
    const s = STRINGS[lang] || STRINGS.it;
    document.documentElement.lang = lang;
    document.title = s.pageTitle;
    document.getElementById('title').textContent = s.title;
    sub.textContent = token ? s.subToken : s.subRequest;
    const label = fields.querySelector('label');
    if (label) label.textContent = token ? s.labelPw : s.labelIdentifier;
    document.getElementById('submit').textContent = s.submit;
    document.getElementById('backLink').textContent = s.backLink;
    for (const b of langSwitch.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.lang === lang);
    }
  }

  const langSwitch = document.getElementById('langSwitch');
  let currentLang = STRINGS[localStorage.getItem('lang')] ? localStorage.getItem('lang') : 'it';

  if (token) {
    fields.innerHTML = `<label for="pw">${STRINGS[currentLang].labelPw}</label>` +
      '<input id="pw" type="password" autocomplete="new-password" minlength="8" required />';
  } else {
    fields.innerHTML = `<label for="identifier">${STRINGS[currentLang].labelIdentifier}</label>` +
      '<input id="identifier" autocomplete="username" required />';
  }
  applyLang(currentLang);

  langSwitch.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]');
    if (!b) return;
    currentLang = b.dataset.lang;
    localStorage.setItem('lang', currentLang);
    applyLang(currentLang);
  });

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg'; msg.textContent = ''; btn.disabled = true;
    try {
      let r, data;
      if (token) {
        r = await fetch('/api/auth/reset/confirm', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: document.getElementById('pw').value }),
        });
        data = await r.json().catch(() => ({}));
        if (r.ok) { msg.className = 'msg ok'; msg.textContent = STRINGS[currentLang].doneToken; return; }
      } else {
        r = await fetch('/api/auth/reset/request', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('identifier').value }),
        });
        data = await r.json().catch(() => ({}));
        if (r.ok) { msg.className = 'msg ok'; msg.textContent = data.message || STRINGS[currentLang].doneRequest; return; }
      }
      msg.className = 'msg err'; msg.textContent = data.error || STRINGS[currentLang].failErr;
    } catch {
      msg.className = 'msg err'; msg.textContent = STRINGS[currentLang].netErr;
    } finally { if (!msg.classList.contains('ok')) btn.disabled = false; }
  });
</script>
</body>
</html>
