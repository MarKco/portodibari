<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — Tracker Porti</title>
<style>
  :root { --bg:#0a0d13; --surface:#141a24; --surface-2:#1c2430; --border:#2a3441;
          --text:#e6edf5; --text-muted:#9aa7b5; --accent:#3b82f6; --accent-hover:#2563eb;
          --red:#ef4444; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:1rem; }
  .card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
          border-radius:14px; padding:2rem 1.75rem; box-shadow:0 12px 40px rgba(0,0,0,.4); }
  h1 { font-size:1.2rem; margin:0 0 .25rem; }
  .sub { color:var(--text-muted); font-size:.85rem; margin:0 0 1.25rem; }
  label { display:block; font-size:.8rem; color:var(--text-muted); margin:.9rem 0 .3rem; }
  input { width:100%; padding:.6rem .7rem; background:var(--surface-2); border:1px solid var(--border);
          border-radius:8px; color:var(--text); font-size:.95rem; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:1.4rem; padding:.7rem; background:var(--accent); color:#fff; border:0;
           border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent-hover); }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:1rem; font-size:.85rem; min-height:1.2em; }
  .msg.err { color:var(--red); }
  .msg.ok { color:var(--green); }
  .links { margin-top:1.3rem; font-size:.82rem; text-align:center; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Reset password</h1>
    <p class="sub" id="sub"></p>
    <div id="fields"></div>
    <button type="submit" id="submit">Continua</button>
    <div class="msg" id="msg"></div>
    <div class="links"><a href="/login">Torna all'accesso</a></div>
  </form>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const sub = document.getElementById('sub');
  const fields = document.getElementById('fields');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');

  if (token) {
    sub.textContent = 'Scegli una nuova password.';
    fields.innerHTML = '<label for="pw">Nuova password</label>' +
      '<input id="pw" type="password" autocomplete="new-password" minlength="8" required />';
  } else {
    sub.textContent = 'Inserisci la tua email o username: senza email configurata il reset va richiesto a un amministratore.';
    fields.innerHTML = '<label for="identifier">Email o username</label>' +
      '<input id="identifier" autocomplete="username" required />';
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg'; msg.textContent = ''; btn.disabled = true;
    try {
      let r, data;
      if (token) {
        r = await fetch('/api/auth/reset/confirm', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: document.getElementById('pw').value }),
        });
        data = await r.json().catch(() => ({}));
        if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'Password aggiornata. Ora puoi accedere.'; return; }
      } else {
        r = await fetch('/api/auth/reset/request', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('identifier').value }),
        });
        data = await r.json().catch(() => ({}));
        if (r.ok) { msg.className = 'msg ok'; msg.textContent = data.message || 'Richiesta registrata.'; return; }
      }
      msg.className = 'msg err'; msg.textContent = data.error || 'Operazione non riuscita';
    } catch {
      msg.className = 'msg err'; msg.textContent = 'Errore di rete';
    } finally { if (!msg.classList.contains('ok')) btn.disabled = false; }
  });
</script>
</body>
</html>
