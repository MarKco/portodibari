<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Registrazione — Tracker Porti</title>
<style>
  :root { --bg:#0a0d13; --surface:#141a24; --surface-2:#1c2430; --border:#2a3441;
          --text:#e6edf5; --text-muted:#9aa7b5; --accent:#3b82f6; --accent-hover:#2563eb;
          --red:#ef4444; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:1rem; }
  .card { position:relative; width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
          border-radius:14px; padding:2rem 1.75rem; box-shadow:0 12px 40px rgba(0,0,0,.4); }
  h1 { font-size:1.25rem; margin:0 0 .25rem; }
  .sub { color:var(--text-muted); font-size:.85rem; margin:0 0 1.25rem; }
  label { display:block; font-size:.8rem; color:var(--text-muted); margin:.8rem 0 .3rem; }
  input { width:100%; padding:.6rem .7rem; background:var(--surface-2); border:1px solid var(--border);
          border-radius:8px; color:var(--text); font-size:.95rem; }
  input:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:.6rem; }
  .row > div { flex:1; }
  button { width:100%; margin-top:1.4rem; padding:.7rem; background:var(--accent); color:#fff; border:0;
           border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent-hover); }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:1rem; font-size:.85rem; min-height:1.2em; }
  .msg.err { color:var(--red); }
  .msg.ok { color:var(--green); }
  .links { margin-top:1.3rem; font-size:.82rem; text-align:center; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .lang-switch { position:absolute; top:.9rem; right:1rem; display:flex; gap:.4rem; font-size:.78rem; }
  .lang-switch button { all:unset; width:auto; margin:0; padding:.15rem .4rem; border-radius:5px;
                         cursor:pointer; color:var(--text-muted); }
  .lang-switch button:hover { color:var(--text); background:var(--surface-2); }
  .lang-switch button.active { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <h1 id="title">Crea un account</h1>
    <p class="sub" id="sub">Dopo la registrazione un amministratore dovrà approvare l'accesso.</p>
    <div class="row">
      <div><label for="first_name" id="labelFirstName">Nome</label><input id="first_name" required /></div>
      <div><label for="last_name" id="labelLastName">Cognome</label><input id="last_name" required /></div>
    </div>
    <label for="email" id="labelEmail">Email</label>
    <input id="email" type="email" autocomplete="email" required />
    <label for="username" id="labelUsername">Username (opzionale)</label>
    <input id="username" autocomplete="username" />
    <label for="password" id="labelPassword">Password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required />
    <button type="submit" id="submit">Registrati</button>
    <div class="msg" id="msg"></div>
    <div class="links"><a href="/login" id="loginLink">Hai già un account? Accedi</a></div>
  </form>
<script>
  // Same 'lang' localStorage key as the app (public/js/i18n.js) and as login.html —
  // a choice made there (or here) carries over across the auth pages.
  const STRINGS = {
    it: {
      pageTitle: 'Registrazione — Tracker Porti',
      title: 'Crea un account',
      sub: 'Dopo la registrazione un amministratore dovrà approvare l\'accesso.',
      labelFirstName: 'Nome', labelLastName: 'Cognome', labelEmail: 'Email',
      labelUsername: 'Username (opzionale)', labelPassword: 'Password',
      submit: 'Registrati', loginLink: 'Hai già un account? Accedi',
      done: 'Registrazione completata. In attesa di approvazione da un amministratore.',
      failErr: 'Registrazione non riuscita', netErr: 'Errore di rete',
    },
    en: {
      pageTitle: 'Register — Tracker Porti',
      title: 'Create an account',
      sub: 'After registering, an administrator will need to approve your access.',
      labelFirstName: 'First name', labelLastName: 'Last name', labelEmail: 'Email',
      labelUsername: 'Username (optional)', labelPassword: 'Password',
      submit: 'Register', loginLink: 'Already have an account? Sign in',
      done: 'Registration complete. Awaiting approval from an administrator.',
      failErr: 'Registration failed', netErr: 'Network error',
    },
  };

  function applyLang(lang) {
    const s = STRINGS[lang] || STRINGS.it;
    document.documentElement.lang = lang;
    document.title = s.pageTitle;
    document.getElementById('title').textContent = s.title;
    document.getElementById('sub').textContent = s.sub;
    document.getElementById('labelFirstName').textContent = s.labelFirstName;
    document.getElementById('labelLastName').textContent = s.labelLastName;
    document.getElementById('labelEmail').textContent = s.labelEmail;
    document.getElementById('labelUsername').textContent = s.labelUsername;
    document.getElementById('labelPassword').textContent = s.labelPassword;
    document.getElementById('submit').textContent = s.submit;
    document.getElementById('loginLink').textContent = s.loginLink;
    for (const b of langSwitch.querySelectorAll('button')) {
      b.classList.toggle('active', b.dataset.lang === lang);
    }
  }

  const langSwitch = document.getElementById('langSwitch');
  let currentLang = STRINGS[localStorage.getItem('lang')] ? localStorage.getItem('lang') : 'it';
  applyLang(currentLang);
  langSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if (!btn) return;
    currentLang = btn.dataset.lang;
    localStorage.setItem('lang', currentLang);
    applyLang(currentLang);
  });

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg'; msg.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          first_name: document.getElementById('first_name').value,
          last_name: document.getElementById('last_name').value,
          email: document.getElementById('email').value,
          username: document.getElementById('username').value || undefined,
          password: document.getElementById('password').value,
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok) {
        msg.className = 'msg ok';
        msg.textContent = STRINGS[currentLang].done;
        form.querySelectorAll('input,button').forEach((el) => (el.disabled = true));
        return;
      }
      msg.className = 'msg err';
      msg.textContent = data.error || STRINGS[currentLang].failErr;
    } catch {
      msg.className = 'msg err'; msg.textContent = STRINGS[currentLang].netErr;
    } finally { if (!msg.classList.contains('ok')) btn.disabled = false; }
  });
</script>
</body>
</html>
