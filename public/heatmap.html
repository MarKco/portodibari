<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copertura AIS</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css"/>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }
    #legend {
      position: absolute;
      bottom: 28px; right: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.93);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }
    #legend h3 { margin: 0 0 5px; font-size: 13px; font-weight: 600; }
    #legend-bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin-bottom: 3px; width: 160px; }
    #legend-bar span { flex: 1; }
    #legend-labels { display: flex; justify-content: space-between; color: #666; margin-bottom: 4px; }
    #legend-info { color: #444; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="legend">
    <h3>Copertura AIS</h3>
    <div id="legend-bar"></div>
    <div id="legend-labels"><span>bassa</span><span>alta</span></div>
    <div id="legend-info">Caricamento…</div>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const map = L.map('map', { worldCopyJump: true, minZoom: 2 }).setView([25, 10], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    const renderer = L.canvas({ padding: 0.5 });
    const layer = L.layerGroup().addTo(map);
    let GRID = 0.5;
    let moveTimer = null;

    // Legend gradient bar
    const bar = document.getElementById('legend-bar');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('span');
      s.style.background = cellColor(i / 39);
      bar.appendChild(s);
    }

    function levelForZoom(z) {
      if (z >= 11) return 0.05;
      if (z >= 9)  return 0.1;
      if (z >= 7)  return 0.25;
      if (z >= 5)  return 0.5;
      if (z >= 4)  return 1.0;
      return 2.0;
    }

    function cellColor(t) {
      const stops = [[30,58,138],[6,182,212],[34,197,94],[234,179,8],[239,68,68]];
      t = Math.max(0, Math.min(1, t));
      const x = t * (stops.length - 1);
      const i = Math.floor(x); const f = x - i;
      const a = stops[i], b = stops[Math.min(i + 1, stops.length - 1)];
      return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',')})`;
    }

    function renderCells(gridDeg, cells) {
      GRID = gridDeg || GRID;
      layer.clearLayers();
      let max = 1;
      for (const c of cells) if (c.c > max) max = c.c;
      const lmax = Math.log1p(max);
      for (const cell of cells) {
        const lat0 = cell.a * GRID, lon0 = cell.o * GRID;
        const t = Math.log1p(cell.c) / lmax;
        L.rectangle([[lat0, lon0], [lat0 + GRID, lon0 + GRID]], {
          renderer, stroke: false, fill: true,
          fillColor: cellColor(t), fillOpacity: 0.6, interactive: false,
        }).addTo(layer);
      }
      const info = document.getElementById('legend-info');
      info.textContent = cells.length
        ? `${cells.length.toLocaleString('it')} celle · max ${max.toLocaleString('it')} msg`
        : 'Nessun dato disponibile';
    }

    async function loadCells() {
      const level = levelForZoom(map.getZoom());
      // Always hide single-message cells here (isolated noise, e.g. satellite
      // position artifacts) — this page is public/read-only with no per-user
      // settings to persist a toggle against.
      let url = `/api/heatmap/public-cells?level=${level}&hideSingletons=1`;
      if (map.getZoom() > 3) {
        const b = map.getBounds();
        url += `&minLat=${b.getSouth().toFixed(4)}&maxLat=${b.getNorth().toFixed(4)}` +
               `&minLon=${b.getWest().toFixed(4)}&maxLon=${b.getEast().toFixed(4)}`;
      }
      try {
        const r = await fetch(url);
        if (!r.ok) return;
        const d = await r.json();
        renderCells(d.gridDeg, d.cells || []);
      } catch { /* ignore */ }
    }

    map.on('moveend', () => {
      clearTimeout(moveTimer);
      moveTimer = setTimeout(loadCells, 250);
    });

    setInterval(() => { if (!document.hidden) loadCells(); }, 30000);

    loadCells();
  </script>
</body>
</html>
