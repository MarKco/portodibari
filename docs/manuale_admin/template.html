<!DOCTYPE html>
<html lang="$if(en)$en$else$it$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$</title>
  <style>
    :root{
      --bg:#0f1620; --panel:#151f2b; --panel2:#1b2836; --text:#e7edf4; --muted:#9fb0c3;
      --border:#26374a; --accent:#3b82f6; --accent2:#60a5fa; --code-bg:#0b1119;
      --shadow:0 8px 30px rgba(0,0,0,.35); --sidebar:300px;
      --green:#22c55e; --yellow:#eab308; --red:#ef4444;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef2f7; --text:#16202c; --muted:#5b6b7d;
        --border:#d7dfe8; --accent:#2563eb; --accent2:#1d4ed8; --code-bg:#f0f3f7; --shadow:0 6px 24px rgba(20,40,70,.10); }
    }
    :root[data-theme="dark"]{
      --bg:#0f1620; --panel:#151f2b; --panel2:#1b2836; --text:#e7edf4; --muted:#9fb0c3;
      --border:#26374a; --accent:#3b82f6; --accent2:#60a5fa; --code-bg:#0b1119; --shadow:0 8px 30px rgba(0,0,0,.35);
    }
    :root[data-theme="light"]{
      --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef2f7; --text:#16202c; --muted:#5b6b7d;
      --border:#d7dfe8; --accent:#2563eb; --accent2:#1d4ed8; --code-bg:#f0f3f7; --shadow:0 6px 24px rgba(20,40,70,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    /* Layout */
    .layout{display:flex; min-height:100vh}
    .sidebar{
      width:var(--sidebar); flex:0 0 var(--sidebar); position:sticky; top:0; align-self:flex-start;
      height:100vh; overflow-y:auto; background:var(--panel); border-right:1px solid var(--border); padding:20px 0;
    }
    .brand{display:flex; align-items:center; gap:10px; padding:0 20px 14px; margin-bottom:8px; border-bottom:1px solid var(--border)}
    .brand .logo{font-size:26px}
    .brand b{font-size:17px; letter-spacing:.2px}
    .brand small{display:block; color:var(--muted); font-size:12px; font-weight:400}
    nav#toc{padding:12px 8px 40px}
    nav#toc ul{list-style:none; margin:0; padding:0}
    nav#toc li{margin:1px 0}
    nav#toc a{
      display:block; padding:6px 12px; color:var(--muted); text-decoration:none; border-radius:8px;
      font-size:14px; line-height:1.35; border-left:3px solid transparent;
    }
    nav#toc a:hover{background:var(--panel2); color:var(--text)}
    nav#toc a.active{color:var(--text); background:var(--panel2); border-left-color:var(--accent)}
    nav#toc > ul > li > ul{margin-left:6px; border-left:1px solid var(--border); padding-left:4px}
    nav#toc > ul > li > ul a{font-size:13px; padding:4px 10px}
    nav#toc > ul > li > ul ul a{font-size:12.5px; padding-left:18px; color:var(--muted)}
    nav#toc > ul > li > a{font-weight:600; color:var(--text)}
    /* Content */
    main{flex:1 1 auto; min-width:0}
    .content{max-width:900px; margin:0 auto; padding:48px 40px 120px}
    h1,h2,h3,h4{line-height:1.25; scroll-margin-top:24px}
    h1{font-size:30px; margin:0 0 8px}
    h2{font-size:24px; margin:52px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--border)}
    h3{font-size:19px; margin:34px 0 10px}
    h4{font-size:16px; margin:24px 0 8px; color:var(--accent2)}
    p{margin:12px 0}
    a{color:var(--accent2)}
    code{background:var(--code-bg); padding:.12em .4em; border-radius:5px; font-size:.88em;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    pre{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; overflow-x:auto}
    pre code{background:none; padding:0}
    blockquote{
      margin:16px 0; padding:12px 16px; background:var(--panel2); border-left:4px solid var(--accent);
      border-radius:0 10px 10px 0; color:var(--text);
    }
    blockquote p{margin:6px 0}
    ul,ol{padding-left:22px}
    li{margin:5px 0}
    hr{border:none; border-top:1px solid var(--border); margin:40px 0}
    /* Tables */
    .table-wrap{overflow-x:auto; margin:16px 0}
    table{border-collapse:collapse; width:100%; font-size:14.5px; background:var(--panel); border-radius:10px; overflow:hidden}
    th,td{border:1px solid var(--border); padding:9px 12px; text-align:left; vertical-align:top}
    th{background:var(--panel2); font-weight:600}
    tbody tr:nth-child(even){background:var(--panel2)}
    /* Images */
    .content img{
      max-width:100%; height:auto; display:block; margin:20px auto; border:1px solid var(--border);
      border-radius:12px; box-shadow:var(--shadow); cursor:zoom-in;
    }
    figure{margin:24px 0}
    figcaption{color:var(--muted); font-size:13px; text-align:center; margin-top:6px; font-style:italic}
    /* Theme toggle */
    #theme{
      position:fixed; right:22px; bottom:22px; z-index:50; width:48px; height:48px; border-radius:50%;
      border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:20px; cursor:pointer;
      box-shadow:var(--shadow);
    }
    #menu-btn{display:none}
    /* Lightbox */
    #lb{position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:100; display:none; align-items:center; justify-content:center; cursor:zoom-out}
    #lb.open{display:flex}
    #lb img{max-width:96vw; max-height:96vh; border-radius:8px; box-shadow:0 10px 50px rgba(0,0,0,.6)}
    /* Responsive */
    @media (max-width:900px){
      #menu-btn{display:flex; align-items:center; justify-content:center; position:fixed; top:14px; left:14px; z-index:60;
        width:44px; height:44px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:20px; cursor:pointer; box-shadow:var(--shadow)}
      .sidebar{position:fixed; z-index:55; transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow)}
      .sidebar.open{transform:translateX(0)}
      .content{padding:70px 20px 100px}
    }
    /* Print / PDF */
    @media print{
      :root{--bg:#fff; --text:#000; --panel:#fff; --panel2:#f3f3f3; --border:#bbb; --muted:#444}
      .sidebar,#theme,#menu-btn,#lb{display:none !important}
      .layout{display:block}
      .content{max-width:none; margin:0; padding:0}
      .content img{cursor:default; box-shadow:none; page-break-inside:avoid; max-height:78vh}
      h2{page-break-after:avoid}
      h3,h4{page-break-after:avoid}
      table,blockquote,figure{page-break-inside:avoid}
      a{color:#000; text-decoration:underline}
      body{font-size:11pt}
    }
  </style>
</head>
<body>
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">⚓</span>
        <span><b>Tracker Porti</b><small>$if(en)$Admin manual$else$Manuale amministratore$endif$</small></span>
      </div>
      <nav id="toc">
        $toc$
      </nav>
    </aside>
    <main>
      <div class="content">
        $body$
      </div>
    </main>
  </div>
  <button id="theme" aria-label="$if(en)$Switch theme$else$Cambia tema$endif$">🌙</button>
  <div id="lb"><img src="" alt=""></div>

  <script>
    // Wrap tables for horizontal scroll
    document.querySelectorAll('main table').forEach(function(t){
      if(t.parentElement.classList.contains('table-wrap')) return;
      var w=document.createElement('div'); w.className='table-wrap';
      t.parentNode.insertBefore(w,t); w.appendChild(t);
    });
    // Theme
    var root=document.documentElement, btn=document.getElementById('theme');
    function applyTheme(t){ root.setAttribute('data-theme',t); btn.textContent = t==='dark'?'☀️':'🌙'; try{localStorage.setItem('tp-manual-theme',t)}catch(e){} }
    (function(){ var s=null; try{s=localStorage.getItem('tp-manual-theme')}catch(e){}
      if(!s){ s = window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
      applyTheme(s);
    })();
    btn.addEventListener('click',function(){ applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });
    // Mobile menu
    var mb=document.getElementById('menu-btn'), sb=document.getElementById('sidebar');
    mb && mb.addEventListener('click',function(){ sb.classList.toggle('open'); });
    document.querySelectorAll('#toc a').forEach(function(a){ a.addEventListener('click',function(){ sb.classList.remove('open'); }); });
    // Lightbox
    var lb=document.getElementById('lb'), lbimg=lb.querySelector('img');
    document.querySelectorAll('main img').forEach(function(im){
      im.addEventListener('click',function(){ lbimg.src=im.src; lbimg.alt=im.alt||''; lb.classList.add('open'); });
    });
    lb.addEventListener('click',function(){ lb.classList.remove('open'); lbimg.src=''; });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') lb.classList.remove('open'); });
    // Active section in TOC (scroll spy)
    var links=[].slice.call(document.querySelectorAll('#toc a[href^="#"]'));
    var map={}; links.forEach(function(a){ var id=decodeURIComponent(a.getAttribute('href').slice(1)); if(id) map[id]=a; });
    var heads=[].slice.call(document.querySelectorAll('main h1[id],main h2[id],main h3[id]'));
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          links.forEach(function(l){l.classList.remove('active')});
          var a=map[en.target.id]; if(a){ a.classList.add('active');
            a.scrollIntoView({block:'nearest'}); }
        }
      });
    },{rootMargin:'-10% 0px -80% 0px', threshold:0});
    heads.forEach(function(h){ obs.observe(h); });
  </script>
</body>
</html>
